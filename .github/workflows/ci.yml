name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The benchmark inputs are bundled in benchmark/ (see benchmark/README.md); no other repo is cloned.
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      - run: uv run python -c "import insider_llm_detection.parse, insider_llm_detection.run, insider_llm_detection.classify, insider_llm_detection.eval, insider_llm_detection.ci"

  test:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      - run: uv run pytest -q

  fixture:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      # fails on any derived-field mismatch; prints every transition into not_logged
      - run: uv run ild fixture-check --fixtures tests/fixtures

  benchmark:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --group dev
      - name: bundled benchmark matches its manifest
        run: uv run ild check-benchmark
      - name: configs (phase, condition ids, variant names)
        run: uv run ild check-configs configs/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: retired vocabulary must not reappear
        run: |
          if grep -nE "reportable[^_]|zero .not_logged. episodes exist|two (true )?omissions|observed twice|BEFORE_RESEARCH|decisions\.md|evaluation_plan|findings\.md|possible_improvements|power_analysis|docs/audits|internal (research )?workspace|standalone repository" README.md EXPERIMENTS.md; then
            echo "retired vocabulary found (see EXPERIMENTS.md)"; exit 1
          fi
