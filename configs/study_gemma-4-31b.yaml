# Study sweep 2026-09-03, small-model tier (added 2026-09-03 at the user's request):
# google/gemma-4-31b-it via OpenRouter. ~20-32B open-weights model; same design as the rest of the
# sweep — full 18-condition grid x 5 prompt variants (none/A/B/C/D) x 3 samples = 270 episodes,
# temperature 1.0, 24k token cap.
model: "google/gemma-4-31b-it"
base_url: "https://openrouter.ai/api/v1"
api_key_env: "OPENROUTER_API_KEY"
temperature: 1.0
max_tokens: 24000
samples_per_condition: 3
variants: ["none", "A", "B", "C", "D"]
concurrency: 4
retries: 4
seed: 0
phase: "study"   # smoke | validation | pilot | study
